<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A-XS — developer building automation, AI-assisted tools and interfaces from Algeria.">
  <title>A-XS — developer, automation, interfaces</title>
  <style>
    .star{animation:twinkle 5s ease-in-out infinite}
    .ring-a{transform-box:fill-box;transform-origin:center;animation:spin 48s linear infinite}
    .ring-b{transform-box:fill-box;transform-origin:center;animation:spin 34s linear infinite reverse}
    .ring-c{transform-box:fill-box;transform-origin:center;animation:spin 66s linear infinite}
    .planet{transform-box:fill-box;transform-origin:center;animation:breathe 7s ease-in-out infinite}
    .sweep{animation:sweep 7s cubic-bezier(.5,0,.2,1) infinite}
    .blink{animation:blink 2.8s ease-in-out infinite}
    .rise{animation:rise .9s cubic-bezier(.22,1,.36,1) both}
    @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes breathe{0%,100%{opacity:.92}50%{opacity:1}}
    @keyframes sweep{0%{transform:translateX(-60px);opacity:0}12%{opacity:1}55%{opacity:.55}100%{transform:translateX(430px);opacity:0}}
    @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  </style>
  <defs>
    <linearGradient id="nameL" x1="40" y1="90" x2="700" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17130F"/>
      <stop offset="0.45" stop-color="#B4481F"/>
      <stop offset="0.78" stop-color="#A8431F"/>
      <stop offset="1" stop-color="#8A3415"/>
    </linearGradient>
    <linearGradient id="ruleL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B4481F" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#A8431F" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8A3415" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C2410C" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#B4481F" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#B4481F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetL" cx="0.34" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#B4481F" stop-opacity="0.95"/>
      <stop offset="0.42" stop-color="#C2410C" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#FDFBF8" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="bgL" cx="0.78" cy="0.1" r="1.1">
      <stop offset="0" stop-color="#FBF7F1"/>
      <stop offset="1" stop-color="#FDFBF8"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="360" fill="url(#bgL)"/>
  <g stroke="#C2410C" stroke-width="1" opacity="0.055"><path d="M0 0V360"/><path d="M60 0V360"/><path d="M120 0V360"/><path d="M180 0V360"/><path d="M240 0V360"/><path d="M300 0V360"/><path d="M360 0V360"/><path d="M420 0V360"/><path d="M480 0V360"/><path d="M540 0V360"/><path d="M600 0V360"/><path d="M660 0V360"/><path d="M720 0V360"/><path d="M780 0V360"/><path d="M840 0V360"/><path d="M900 0V360"/><path d="M960 0V360"/><path d="M1020 0V360"/><path d="M1080 0V360"/><path d="M1140 0V360"/><path d="M1200 0V360"/><path d="M0 0H1200"/><path d="M0 60H1200"/><path d="M0 120H1200"/><path d="M0 180H1200"/><path d="M0 240H1200"/><path d="M0 300H1200"/><path d="M0 360H1200"/></g>
  
  <circle cx="958" cy="184" r="230" fill="url(#glowL)" opacity="0.55"/>
  <g opacity="0.9">
    <circle class="ring-a" cx="958" cy="184" r="124" stroke="#E2D9CD" stroke-width="1" stroke-dasharray="2 7"/>
    <circle class="ring-b" cx="958" cy="184" r="98" stroke="#B4481F" stroke-opacity="0.42" stroke-width="1" stroke-dasharray="28 12"/>
    <ellipse class="ring-c" cx="958" cy="184" rx="156" ry="46" stroke="#A8431F" stroke-opacity="0.34" stroke-width="1" transform="rotate(-24 958 184)"/>
    <circle class="ring-b" cx="958" cy="184" r="146" stroke="#EFE7DC" stroke-width="1"/>
    <circle cx="958" cy="38" r="2.6" fill="#A8431F"/>
    <circle cx="1078" cy="246" r="2.2" fill="#B4481F"/>
    <circle cx="802" cy="224" r="2" fill="#8A3415"/>
  </g>
  <g class="planet">
    <circle cx="958" cy="184" r="58" fill="url(#planetL)" stroke="#B4481F" stroke-opacity="0.6"/>
    <clipPath id="pcL"><circle cx="958" cy="184" r="58"/></clipPath>
    <g clip-path="url(#pcL)" stroke="#17130F" stroke-opacity="0.16" stroke-width="1">
      <path d="M900 162H1016"/>
      <path d="M900 184H1016"/>
      <path d="M900 206H1016"/>
      <ellipse cx="958" cy="184" rx="20" ry="58"/>
      <ellipse cx="958" cy="184" rx="40" ry="58"/>
    </g>
    <circle cx="958" cy="184" r="58" fill="none" stroke="#17130F" stroke-opacity="0.18"/>
  </g>
  <g>
    <text x="40" y="74" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="4.4" fill="#B4481F">A-XS / PROFILE</text>
    <text x="40" y="92" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" letter-spacing="2.6" fill="#857C73">DEVELOPER · AUTOMATION · INTERFACES</text>
    <g class="rise" style="animation-delay:.05s">
      <text x="38" y="196" font-family="Georgia, 'Times New Roman', 'Iowan Old Style', serif" font-size="92" letter-spacing="-1" fill="url(#nameL)">A-XS</text>
    </g>
    <rect x="40" y="216" width="330" height="2" fill="url(#ruleL)"/>
    <rect class="sweep" x="40" y="215" width="120" height="4" rx="2" fill="#A8431F" opacity="0.9"/>
    <g class="rise" style="animation-delay:.16s">
      <text x="40" y="258" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#17130F" fill-opacity="0.9">I build small tools that take a boring job away.</text>
      <text x="40" y="288" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#57504A">Self-taught developer in Algeria. Python, TypeScript, a bit of 3D.</text>
    </g>
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" letter-spacing="1.8" fill="#857C73">
      <circle class="blink" cx="42" cy="318" r="3.4" fill="#7C2D12"/>
      <text x="54" y="322">AVAILABLE FOR WORK</text>
      <text x="226" y="322">·</text>
      <text x="240" y="322">UTC+1</text>
      <text x="306" y="322">·</text>
      <text x="320" y="322">PROJECTS PRIVATE</text>
    </g>
    <text x="1160" y="322" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" letter-spacing="2.4" fill="#857C73">001 / PORTFOLIO</text>
  </g>
</svg>