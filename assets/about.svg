<svg width="840" height="268" viewBox="0 0 840 268" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="About A-XS: full-stack developer. Privacy-first software, built end to end. Open to paid work.">
  <title>About</title>
  <style>
    .rise{animation:rise .8s cubic-bezier(.22,1,.36,1) both}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.22,1,.36,1) both}
    .blink{animation:blink 2.6s ease-in-out infinite}
    .sweep{animation:sweep 6s cubic-bezier(.5,0,.2,1) infinite}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 56s linear infinite}
    .spin-r{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite reverse}
    .star{animation:twinkle 5s ease-in-out infinite}
    .cell{animation:pop .5s cubic-bezier(.22,1,.36,1) both}
    .fade{animation:fade 1.4s ease-out both}
    .float{animation:float 7s ease-in-out infinite}
    .dash{animation:dash 24s linear infinite}
    .scan{animation:scan 7.5s cubic-bezier(.45,0,.25,1) infinite}
    .draw{animation:draw 3.2s cubic-bezier(.4,0,.2,1) .3s both}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
    @keyframes sweep{0%{transform:translateX(0);opacity:0}16%{opacity:.9}70%{opacity:.35}100%{transform:translateX(128px);opacity:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes twinkle{0%,100%{opacity:.14}50%{opacity:.8}}
    @keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes float{0%,100%{transform:translateY(-3.5px)}50%{transform:translateY(3.5px)}}
    @keyframes dash{to{stroke-dashoffset:-240}}
    @keyframes scan{0%{transform:translateX(0);opacity:0}12%{opacity:1}82%{opacity:1}100%{transform:translateX(744px);opacity:0}}
    @keyframes draw{to{stroke-dashoffset:0}}
  </style>
  <rect x="0.5" y="0.5" width="839" height="267" rx="16" fill="#0A0A0A" stroke="#262626"/>
  <text x="32" y="38" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" letter-spacing="2.6" fill="#EDEDED">ABOUT</text><path d="M32 52H808" stroke="#262626"/>
  <g class="fade">
    <text x="32" y="92" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#A3A3A3">I take a project end to end: database, API, interface and</text><text x="32" y="114" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#A3A3A3">deploy. React and Next.js most days, Python when there is work</text><text x="32" y="136" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#A3A3A3">worth automating.</text>
    <text x="32" y="178" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#A3A3A3">Privacy decides the shape: no analytics, no cookies, no</text><text x="32" y="200" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#A3A3A3">trackers, no accounts you didn't ask for. Ask and I'll walk</text><text x="32" y="222" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#A3A3A3">you through the code.</text>
  </g>
  <text x="560" y="92" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="1.4" fill="#8F8F8F">ROLE</text><text x="560" y="115" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#F5F5F5" fill-opacity=".92">Full-stack developer</text><path d="M560 126H808" stroke="#1B1B1B"/><text x="560" y="148" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="1.4" fill="#8F8F8F">FOCUS</text><text x="560" y="171" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#F5F5F5" fill-opacity=".92">Privacy-first software</text><path d="M560 182H808" stroke="#1B1B1B"/><text x="560" y="204" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="1.4" fill="#8F8F8F">OPEN TO</text><text x="560" y="227" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#F5F5F5" fill-opacity=".92">Paid work</text>
</svg>