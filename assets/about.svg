<svg width="840" height="272" viewBox="0 0 840 272" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="About A-XS: full-stack developer. Privacy-first software, built end to end. Open to paid work.">
  <title>About</title>
  <style>
    .rise{animation:rise .8s cubic-bezier(.22,1,.36,1) both}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.22,1,.36,1) both}
    .blink{animation:blink 2.6s ease-in-out infinite}
    .sweep{animation:sweep 6s cubic-bezier(.5,0,.2,1) infinite}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 56s linear infinite}
    .spin-r{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite reverse}
    .star{animation:twinkle 5s ease-in-out infinite}
    .cell{animation:pop .5s cubic-bezier(.22,1,.36,1) both}
    .fade{animation:fade 1.4s ease-out both}
    .float{animation:float 7s ease-in-out infinite}
    .dash{animation:dash 24s linear infinite}
    .draw{animation:draw 3.2s cubic-bezier(.4,0,.2,1) .3s both}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
    @keyframes sweep{0%{transform:translateX(0);opacity:0}16%{opacity:.9}70%{opacity:.35}100%{transform:translateX(128px);opacity:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes twinkle{0%,100%{opacity:.14}50%{opacity:.8}}
    @keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes float{0%,100%{transform:translateY(-3.5px)}50%{transform:translateY(3.5px)}}
    @keyframes dash{to{stroke-dashoffset:-240}}
    @keyframes draw{to{stroke-dashoffset:0}}
  </style><style> .bar{animation:bar 6s ease-in-out infinite} @keyframes bar{0%,100%{opacity:.18}50%{opacity:.8}}</style>
  <rect x="0.5" y="0.5" width="839" height="271" rx="16" fill="#0A0A0A" stroke="#262626"/>
  <text x="32" y="38" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" letter-spacing="2.6" fill="#EDEDED">ABOUT</text><text x="808" y="38" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="1.4" fill="#8F8F8F">A-XS</text><path d="M32 52H808" stroke="#262626"/>
  <rect class="bar" x="20" y="78" width="2" height="152" rx="1" fill="#FFFFFF"/>
  <g class="fade">
    <text x="32" y="96" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#A3A3A3">I take a project end to end: database, API, interface and</text><text x="32" y="118" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#A3A3A3">deploy. React and Next.js most days, Python when there is</text><text x="32" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#A3A3A3">work worth automating.</text>
    <text x="32" y="170" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#A3A3A3">Privacy decides the shape: no analytics, no cookies, no</text><text x="32" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#A3A3A3">trackers, no logins you didn't ask for. Ask and I'll walk</text><text x="32" y="214" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#A3A3A3">you through the code.</text>
  </g>
  <g class="fade" style="animation-delay:.45s">
    <text x="32" y="242" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" letter-spacing="1.4" fill="#A3A3A3">NO ANALYTICS · NO COOKIES · NO TRACKERS</text>
  </g>
  <text x="566" y="96" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="1.4" fill="#8F8F8F">ROLE</text><text x="566" y="121" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#F5F5F5" fill-opacity=".94">Full-stack developer</text><rect class="grow" x="566" y="135" width="242" height="1" fill="#262626" style="animation-delay:0.3s"/><text x="566" y="154" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="1.4" fill="#8F8F8F">FOCUS</text><text x="566" y="179" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#F5F5F5" fill-opacity=".94">Privacy-first software</text><rect class="grow" x="566" y="193" width="242" height="1" fill="#262626" style="animation-delay:0.44s"/><text x="566" y="212" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="1.4" fill="#8F8F8F">OPEN TO</text><text x="566" y="237" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#F5F5F5" fill-opacity=".94">Paid work</text><rect class="grow" x="566" y="251" width="242" height="1" fill="#262626" style="animation-delay:0.58s"/>
</svg>