<svg width="840" height="306" viewBox="0 0 840 306" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal: the command echo 83 84 65 89 [80 82 73 86 65 84 69] is decoded from ASCII into the words STAY PRIVATE.">
  <title>Terminal</title>
  <style>
    .rise{animation:rise .8s cubic-bezier(.22,1,.36,1) both}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.22,1,.36,1) both}
    .blink{animation:blink 2.6s ease-in-out infinite}
    .sweep{animation:sweep 6s cubic-bezier(.5,0,.2,1) infinite}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 56s linear infinite}
    .spin-r{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite reverse}
    .star{animation:twinkle 5s ease-in-out infinite}
    .cell{animation:pop .5s cubic-bezier(.22,1,.36,1) both}
    .fade{animation:fade 1.4s ease-out both}
    .float{animation:float 7s ease-in-out infinite}
    .dash{animation:dash 24s linear infinite}
    .draw{animation:draw 3.2s cubic-bezier(.4,0,.2,1) .3s both}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
    @keyframes sweep{0%{transform:translateX(0);opacity:0}16%{opacity:.9}70%{opacity:.35}100%{transform:translateX(128px);opacity:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes twinkle{0%,100%{opacity:.14}50%{opacity:.8}}
    @keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes float{0%,100%{transform:translateY(-3.5px)}50%{transform:translateY(3.5px)}}
    @keyframes dash{to{stroke-dashoffset:-240}}
    @keyframes draw{to{stroke-dashoffset:0}}
  </style><style> .typed{transform-box:fill-box;transform-origin:left center;animation:typein 1.7s steps(39,end) .5s both} .caret{animation:caretslide 1.7s steps(39,end) .5s both} .caret-hide{animation:carethide 1ms linear 2.24s forwards} .caret-blink{animation:caretblink 1.05s steps(1,end) 2.3s infinite} @keyframes typein{from{transform:scaleX(0)}to{transform:scaleX(1)}} @keyframes caretslide{from{transform:translateX(0)}to{transform:translateX(304.2px)}} @keyframes carethide{to{opacity:0}} @keyframes caretblink{0%,49%{opacity:1}50%,100%{opacity:0}}</style>
  <defs>
    <linearGradient id="bar" x1="0" y1="64" x2="0" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161616"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="839" height="305" rx="16" fill="#0A0A0A" stroke="#262626"/>
  <text x="32" y="38" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" letter-spacing="2.6" fill="#EDEDED">TERMINAL</text><text x="808" y="38" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="1.4" fill="#8F8F8F">ASCII DECODE</text><path d="M32 52H808" stroke="#262626"/>
  <rect x="32" y="64" width="776" height="228" rx="12" fill="#0B0B0B" stroke="#262626"/>
  <rect x="32" y="64" width="776" height="32" rx="12" fill="url(#bar)"/>
  <rect x="32" y="84" width="776" height="12" fill="url(#bar)"/>
  <path d="M32 96H808" stroke="#1B1B1B"/>

  <g>
    <circle cx="54" cy="80" r="7.4" fill="#FF5F57" opacity=".16"/>
    <circle cx="54" cy="80" r="4.4" fill="#FF5F57"/>
    <circle cx="72" cy="80" r="7.4" fill="#FEBC2E" opacity=".16"/>
    <circle cx="72" cy="80" r="4.4" fill="#FEBC2E"/>
    <circle cx="90" cy="80" r="7.4" fill="#28C840" opacity=".16"/>
    <circle cx="90" cy="80" r="4.4" fill="#28C840"/>
  </g>
  <text x="110" y="84" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" letter-spacing=".6" fill="#8F8F8F">axs — privacy shell</text>
  <text x="796" y="84" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" letter-spacing="1.6" fill="#5E5E5E">TTY / 01</text>

  <text x="46" y="124" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="700" fill="#4ADE80">$</text>
  <text x="64" y="124" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#F5F5F5"
        textLength="304.2" lengthAdjust="spacing">echo 83 84 65 89 [80 82 73 86 65 84 69]</text>
  <rect class="typed" x="64" y="111" width="304.2" height="18" fill="#0B0B0B"/>
  <g class="caret">
    <g class="caret-hide">
      <rect class="caret-blink" x="64" y="112" width="7.6" height="14.5" rx="1" fill="#4ADE80"/>
    </g>
  </g>

  <g class="fade" style="animation-delay:2.42s">
    <text x="46" y="152" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4A4A4A">├</text>
    <text x="64" y="152" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#8F8F8F">83 84 65 89</text>
    <text x="164" y="152" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4A4A4A">→</text>
    <text x="184" y="152" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" letter-spacing="3" fill="#F5F5F5" fill-opacity=".92">S T A Y</text>
  </g>
  <g class="fade" style="animation-delay:2.56s">
    <text x="46" y="172" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4A4A4A">└</text>
    <text x="64" y="172" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#8F8F8F">80 82 73 86 65 84 69</text>
    <text x="228" y="172" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4A4A4A">→</text>
    <text x="248" y="172" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" letter-spacing="3" fill="#F5F5F5" fill-opacity=".92">P R I V A T E</text>
  </g>

  <g class="rise" style="animation-delay:2.72s">
    <text x="46" y="218" font-family="Georgia, 'Times New Roman', 'Iowan Old Style', serif" font-size="34" letter-spacing="4.5" fill="#F5F5F5">STAY PRIVATE</text>
  </g>
  <rect class="grow" x="46" y="229" width="292" height="1.4" fill="url(#rule)" style="animation-delay:2.98s"/>

  <g class="fade" style="animation-delay:3.15s">
    <text x="46" y="252" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#A3A3A3"># 7 bytes in, two words out. No analytics, no cookies, no trackers.</text>
  </g>
  <g class="fade" style="animation-delay:3.4s">
    <text x="46" y="274" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="700" fill="#4ADE80">$</text>
    <rect class="caret-blink" x="64" y="261" width="7.6" height="15" rx="1" fill="#F5F5F5" opacity=".9"/>
  </g>

  <path d="M588 110V276" stroke="#1B1B1B"/>
  <g class="fade" style="animation-delay:2.9s">
    <text x="612" y="128" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" letter-spacing="2.2" fill="#5E5E5E">SESSION</text>
  </g>
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" letter-spacing=".6">
    <g class="fade" style="animation-delay:3s">
      <text x="612" y="156" fill="#6E6E6E">shell</text>
      <text x="792" y="156" text-anchor="end" fill="#F5F5F5" fill-opacity=".78">zsh</text>
    </g>
    <g class="fade" style="animation-delay:3.08s">
      <text x="612" y="182" fill="#6E6E6E">bytes</text>
      <text x="792" y="182" text-anchor="end" fill="#F5F5F5" fill-opacity=".78">7</text>
    </g>
    <g class="fade" style="animation-delay:3.16s">
      <text x="612" y="208" fill="#6E6E6E">chars</text>
      <text x="792" y="208" text-anchor="end" fill="#F5F5F5" fill-opacity=".78">12</text>
    </g>
    <g class="fade" style="animation-delay:3.24s">
      <text x="612" y="234" fill="#6E6E6E">trackers</text>
      <text x="792" y="234" text-anchor="end" fill="#4ADE80">0</text>
    </g>
    <g class="fade" style="animation-delay:3.32s">
      <text x="612" y="260" fill="#6E6E6E">cookies</text>
      <text x="792" y="260" text-anchor="end" fill="#4ADE80">0</text>
    </g>
  </g>
</svg>