<svg width="840" height="306" viewBox="0 0 840 306" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal: the command echo 83 84 65 89 [80 82 73 86 65 84 69] is decoded from ASCII into the words STAY PRIVATE.">
  <title>Terminal</title>
  <style>
    .rise{animation:rise .8s cubic-bezier(.22,1,.36,1) both}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.22,1,.36,1) both}
    .blink{animation:blink 2.6s ease-in-out infinite}
    .sweep{animation:sweep 6s cubic-bezier(.5,0,.2,1) infinite}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 56s linear infinite}
    .spin-r{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite reverse}
    .star{animation:twinkle 5s ease-in-out infinite}
    .cell{animation:pop .5s cubic-bezier(.22,1,.36,1) both}
    .fade{animation:fade 1.4s ease-out both}
    .float{animation:float 7s ease-in-out infinite}
    .dash{animation:dash 24s linear infinite}
    .draw{animation:draw 3.2s cubic-bezier(.4,0,.2,1) .3s both}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
    @keyframes sweep{0%{transform:translateX(0);opacity:0}16%{opacity:.9}70%{opacity:.35}100%{transform:translateX(128px);opacity:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes twinkle{0%,100%{opacity:.14}50%{opacity:.8}}
    @keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes float{0%,100%{transform:translateY(-3.5px)}50%{transform:translateY(3.5px)}}
    @keyframes dash{to{stroke-dashoffset:-240}}
    @keyframes draw{to{stroke-dashoffset:0}}
  </style><style> @keyframes tmove{0%{transform:translateX(0)}6.25%{transform:translateX(0)}23.96%{transform:translateX(304.2px)}93.75%{transform:translateX(304.2px)}94.27%{transform:translateX(0)}100%{transform:translateX(0)}} @keyframes tbar{0%{opacity:1}24.17%{opacity:1}24.79%{opacity:0}93.96%{opacity:0}94.17%{opacity:1}100%{opacity:1}} @keyframes lrule{0%{transform:scaleX(0)}31.46%{transform:scaleX(0)}34.58%{transform:scaleX(1)}87.5%{transform:scaleX(1)}93.75%{transform:scaleX(0)}} @keyframes ld1{0%{opacity:0}26.04%{opacity:0}29.79%{opacity:1}87.5%{opacity:1}93.75%{opacity:0}100%{opacity:0}} @keyframes ld2{0%{opacity:0}27.92%{opacity:0}31.67%{opacity:1}87.5%{opacity:1}93.75%{opacity:0}100%{opacity:0}} @keyframes lhead{0%{opacity:0}29.79%{opacity:0}33.54%{opacity:1}87.5%{opacity:1}93.75%{opacity:0}100%{opacity:0}} @keyframes lnote{0%{opacity:0}32.92%{opacity:0}36.67%{opacity:1}87.5%{opacity:1}93.75%{opacity:0}100%{opacity:0}} @keyframes lprompt{0%{opacity:0}34.79%{opacity:0}38.54%{opacity:1}87.5%{opacity:1}93.75%{opacity:0}100%{opacity:0}} @keyframes lsession{0%{opacity:0}30.63%{opacity:0}34.38%{opacity:1}87.5%{opacity:1}93.75%{opacity:0}100%{opacity:0}} @keyframes lrow1{0%{opacity:0}31.46%{opacity:0}35.21%{opacity:1}87.5%{opacity:1}93.75%{opacity:0}100%{opacity:0}} @keyframes lrow2{0%{opacity:0}32.29%{opacity:0}36.04%{opacity:1}87.5%{opacity:1}93.75%{opacity:0}100%{opacity:0}} @keyframes lrow3{0%{opacity:0}33.13%{opacity:0}36.88%{opacity:1}87.5%{opacity:1}93.75%{opacity:0}100%{opacity:0}} @keyframes lrow4{0%{opacity:0}33.96%{opacity:0}37.71%{opacity:1}87.5%{opacity:1}93.75%{opacity:0}100%{opacity:0}} @keyframes lrow5{0%{opacity:0}34.79%{opacity:0}38.54%{opacity:1}87.5%{opacity:1}93.75%{opacity:0}100%{opacity:0}} @keyframes lenter{0%{opacity:0}24.38%{opacity:0}26.25%{opacity:1}87.5%{opacity:1}93.75%{opacity:0}100%{opacity:0}} .mg{transform-box:fill-box;transform-origin:left center}</style>
