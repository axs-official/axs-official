<svg width="840" height="268" viewBox="0 0 840 268" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal: the command echo 83 84 65 89 [80 82 73 86 65 84 69] is decoded from ASCII into the words STAY PRIVATE.">
  <title>Terminal</title>
  <style>
    .rise{animation:rise .8s cubic-bezier(.22,1,.36,1) both}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.22,1,.36,1) both}
    .blink{animation:blink 2.6s ease-in-out infinite}
    .sweep{animation:sweep 6s cubic-bezier(.5,0,.2,1) infinite}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 56s linear infinite}
    .spin-r{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite reverse}
    .star{animation:twinkle 5s ease-in-out infinite}
    .cell{animation:pop .5s cubic-bezier(.22,1,.36,1) both}
    .fade{animation:fade 1.4s ease-out both}
    .float{animation:float 7s ease-in-out infinite}
    .dash{animation:dash 24s linear infinite}
    .scan{animation:scan 7.5s cubic-bezier(.45,0,.25,1) infinite}
    .draw{animation:draw 3.2s cubic-bezier(.4,0,.2,1) .3s both}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
    @keyframes sweep{0%{transform:translateX(0);opacity:0}16%{opacity:.9}70%{opacity:.35}100%{transform:translateX(128px);opacity:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes twinkle{0%,100%{opacity:.14}50%{opacity:.8}}
    @keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes float{0%,100%{transform:translateY(-3.5px)}50%{transform:translateY(3.5px)}}
    @keyframes dash{to{stroke-dashoffset:-240}}
    @keyframes scan{0%{transform:translateX(0);opacity:0}12%{opacity:1}82%{opacity:1}100%{transform:translateX(744px);opacity:0}}
    @keyframes draw{to{stroke-dashoffset:0}}
  </style><style> .type{animation:type 1.8s steps(44,end) .4s both} .caret{animation:caret 1.1s steps(1,end) infinite} @keyframes type{from{transform:translateX(0)}to{transform:translateX(340px)}} @keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}</style>
  <rect x="0.5" y="0.5" width="839" height="267" rx="16" fill="#0A0A0A" stroke="#262626"/>
  <text x="32" y="38" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" letter-spacing="2.6" fill="#EDEDED">TERMINAL</text><text x="808" y="38" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="1.4" fill="#8F8F8F">ASCII DECODE</text><path d="M32 52H808" stroke="#262626"/>
  <rect x="32" y="66" width="776" height="178" rx="12" fill="#0C0C0C" stroke="#262626"/>
  <circle cx="52" cy="86" r="4" fill="#2A2A2A"/>
  <circle cx="68" cy="86" r="4" fill="#2A2A2A"/>
  <circle cx="84" cy="86" r="4" fill="#4ADE80" opacity=".8"/>
  <text x="106" y="90" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="1.6" fill="#8F8F8F">axs — privacy shell</text>
  <text x="44" y="124" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#4ADE80">$</text>
  <text x="58" y="124" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#F5F5F5">echo 83 84 65 89 [80 82 73 86 65 84 69]</text>
  <rect class="type" x="58" y="111" width="330" height="17" fill="#0C0C0C"/>
  <rect class="caret" x="410" y="112" width="7" height="15" fill="#4ADE80" opacity=".85"/>
  <g class="fade" style="animation-delay:2.1s">
    <text x="44" y="152" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#8F8F8F">&gt; ascii.dec(83 84 65 89) + ascii.dec(80 82 73 86 65 84 69)</text>
  </g>
  <g class="rise" style="animation-delay:2.4s">
    <text x="44" y="198" font-family="Georgia, 'Times New Roman', 'Iowan Old Style', serif" font-size="34" letter-spacing="4" fill="#F5F5F5">STAY PRIVATE</text>
  </g>
  <g class="fade" style="animation-delay:2.9s">
    <text x="44" y="226" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#A3A3A3"># 7 bytes in, two words out. No analytics, no cookies, no trackers.</text>
  </g>
</svg>