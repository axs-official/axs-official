<svg width="840" height="326" viewBox="0 0 840 326" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Things axs has built: this site, the GitHub profile cards, and private automation work.">
  <title>Work</title>
  <style>
    .rise{animation:rise .8s cubic-bezier(.22,1,.36,1) both}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.22,1,.36,1) both}
    .blink{animation:blink 2.6s ease-in-out infinite}
    .sweep{animation:sweep 6s cubic-bezier(.5,0,.2,1) infinite}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 56s linear infinite}
    .spin-r{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite reverse}
    .star{animation:twinkle 5s ease-in-out infinite}
    .cell{animation:pop .5s cubic-bezier(.22,1,.36,1) both}
    .fade{animation:fade 1.4s ease-out both}
    .float{animation:float 7s ease-in-out infinite}
    .dash{animation:dash 24s linear infinite}
    .scan{animation:scan 7.5s cubic-bezier(.45,0,.25,1) infinite}
    .draw{animation:draw 3.2s cubic-bezier(.4,0,.2,1) .3s both}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
    @keyframes sweep{0%{transform:translateX(0);opacity:0}16%{opacity:.9}70%{opacity:.35}100%{transform:translateX(128px);opacity:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes twinkle{0%,100%{opacity:.14}50%{opacity:.8}}
    @keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes float{0%,100%{transform:translateY(-3.5px)}50%{transform:translateY(3.5px)}}
    @keyframes dash{to{stroke-dashoffset:-240}}
    @keyframes scan{0%{transform:translateX(0);opacity:0}12%{opacity:1}82%{opacity:1}100%{transform:translateX(744px);opacity:0}}
    @keyframes draw{to{stroke-dashoffset:0}}
  </style>
  <rect x="0.5" y="0.5" width="839" height="325" rx="16" fill="#0A0A0A" stroke="#262626"/>
  <text x="32" y="38" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" letter-spacing="2.6" fill="#9CB4FF">WORK</text><path d="M32 52H808" stroke="#262626"/>
  <g class="rise" style="animation-delay:0.0s">
      <text x="32" y="86" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#F5F5F5">This site</text>
      <text x="32" y="109" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" letter-spacing="1.1" fill="#A3A3A3">NEXT.JS · THREE.JS · TAILWIND</text>
      <text x="330" y="85" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#A3A3A3">The page you're on. 3D hero, my own contribution data, static</text><text x="330" y="104" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#A3A3A3">build on GitHub Pages.</text>
    </g><path d="M32 142H808" stroke="#1B1B1B"/><g class="rise" style="animation-delay:0.08s">
      <text x="32" y="166" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#F5F5F5">GitHub profile</text>
      <text x="32" y="189" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" letter-spacing="1.1" fill="#A3A3A3">SVG · PYTHON</text>
      <text x="330" y="165" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#A3A3A3">These cards. A Python script, animated with CSS inside the</text><text x="330" y="184" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#A3A3A3">SVG.</text>
    </g><path d="M32 222H808" stroke="#1B1B1B"/><g class="rise" style="animation-delay:0.16s">
      <text x="32" y="246" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#F5F5F5">Everything else</text>
      <text x="32" y="269" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" letter-spacing="1.1" fill="#A3A3A3">PRIVATE</text>
      <text x="330" y="245" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#A3A3A3">Scripts, private apps, half-finished ideas. Ask and I'll walk</text><text x="330" y="264" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#A3A3A3">you through one.</text>
    </g>
</svg>