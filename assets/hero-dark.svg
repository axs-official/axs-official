<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A-XS — developer building automation, AI-assisted tools and interfaces from Algeria.">
  <title>A-XS — developer, automation, interfaces</title>
  <style>
    .star{animation:twinkle 5s ease-in-out infinite}
    .ring-a{transform-box:fill-box;transform-origin:center;animation:spin 48s linear infinite}
    .ring-b{transform-box:fill-box;transform-origin:center;animation:spin 34s linear infinite reverse}
    .ring-c{transform-box:fill-box;transform-origin:center;animation:spin 66s linear infinite}
    .planet{transform-box:fill-box;transform-origin:center;animation:breathe 7s ease-in-out infinite}
    .sweep{animation:sweep 7s cubic-bezier(.5,0,.2,1) infinite}
    .blink{animation:blink 2.8s ease-in-out infinite}
    .rise{animation:rise .9s cubic-bezier(.22,1,.36,1) both}
    @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes breathe{0%,100%{opacity:.92}50%{opacity:1}}
    @keyframes sweep{0%{transform:translateX(-60px);opacity:0}12%{opacity:1}55%{opacity:.55}100%{transform:translateX(430px);opacity:0}}
    @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  </style>
