<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A-XS avatar">
    <title>A-XS</title>
    <defs>
    <linearGradient id="titleGrad" gradientUnits="userSpaceOnUse" x1="60" y1="80" x2="640" y2="300">
      <stop offset="0" stop-color="#4ce7ff"/>
      <stop offset="0.38" stop-color="#6a8cff"/>
      <stop offset="0.7" stop-color="#9b6cff"/>
      <stop offset="1" stop-color="#ff5fc8"/>
    </linearGradient>
    <linearGradient id="numGrad" gradientUnits="userSpaceOnUse" x1="40" y1="90" x2="1160" y2="220">
      <stop offset="0" stop-color="#4ce7ff"/>
      <stop offset="0.45" stop-color="#6a8cff"/>
      <stop offset="0.75" stop-color="#9b6cff"/>
      <stop offset="1" stop-color="#ff5fc8"/>
    </linearGradient>
    <linearGradient id="barGrad" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0">
      <stop offset="0" stop-color="#4ce7ff"/>
      <stop offset="0.55" stop-color="#6a8cff"/>
      <stop offset="1" stop-color="#9b6cff"/>
    </linearGradient>
    <linearGradient id="cellHot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ce7ff"/>
      <stop offset="0.55" stop-color="#9b6cff"/>
      <stop offset="1" stop-color="#ff5fc8"/>
    </linearGradient>
    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#4ce7ff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#4ce7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet">
      <stop offset="0" stop-color="#9b6cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9b6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGrad">
      <stop offset="0" stop-color="#16224a"/>
      <stop offset="0.62" stop-color="#070a14"/>
      <stop offset="1" stop-color="#02030a"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1a2240" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.78" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask">
      <rect width="100%" height="100%" fill="url(#gridFade)"/>
    </mask>
  </defs>
    
    <style>
      .spin-slow { transform-box: view-box; animation: spin 44s linear infinite; }
      .spin-reverse { transform-box: view-box; animation: spin 29s linear infinite reverse; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 4.8s ease-in-out infinite; }
      .twinkle { animation: twinkle 5.5s ease-in-out infinite; }
      .float { transform-box: fill-box; transform-origin: center; animation: float 7s ease-in-out infinite; }
      .cell { transform-box: fill-box; transform-origin: center; animation: cell-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .bar { transform-box: fill-box; transform-origin: bottom; animation: bar-in 0.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 0.78; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1.03); } }
      @keyframes twinkle { 0%, 100% { opacity: 0.18; } 50% { opacity: 0.75; } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes cell-in { from { opacity: 0; transform: scale(0.35); } to { opacity: 1; transform: scale(1); } }
      @keyframes bar-in { from { opacity: 0; transform: scaleY(0.08); } to { opacity: 1; transform: scaleY(1); } }
      @media (prefers-reduced-motion: reduce) {
        .spin-slow, .spin-reverse, .pulse, .twinkle, .float, .cell, .bar { animation: none !important; }
      }
    </style>
  
    <rect width="512" height="512" fill="#05050c"/>
    <circle cx="256" cy="256" r="300" fill="url(#glowViolet)" opacity="0.9"/>
    <circle cx="110" cy="430" r="250" fill="url(#glowCyan)" opacity="0.8"/>
    <rect width="512" height="512" fill="url(#grid)" opacity="0.22" mask="url(#gridMask)"/>
    <g class="spin-slow" style="transform-origin:256px 256px">
      <circle cx="256" cy="256" r="196" stroke="#4ce7ff" stroke-opacity="0.28" stroke-dasharray="2 10"/>
      <circle cx="256" cy="60" r="4" fill="#4ce7ff"/>
    </g>
    <g class="spin-reverse" style="transform-origin:256px 256px">
      <circle cx="256" cy="256" r="158" stroke="#9b6cff" stroke-opacity="0.32"/>
      <circle cx="414" cy="256" r="3" fill="#ff5fc8"/>
    </g>
    <circle cx="256" cy="256" r="128" fill="#0b0f1e" stroke="#2c3a68" stroke-width="1.5"/>
    <circle cx="256" cy="256" r="112" fill="url(#coreGrad)" stroke="#2c3a68" stroke-width="1"/>
