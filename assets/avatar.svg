    <text x="256" y="338" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="3.4" fill="#7f8aad">DEVELOPER / AUTOMATION</text>
    
    <g stroke="#2c3a68" stroke-width="0.9" opacity="0.7">
      <path d="M24 24h11M24 24v11"/>
      <path d="M488 24h-11M488 24v11"/>
