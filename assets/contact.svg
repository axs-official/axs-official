<svg width="840" height="150" viewBox="0 0 840 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Contact A-XS at axs.official@gmail.com. Open to work and to small automation jobs.">
  <title>Contact</title>
  <style>
    .rise{animation:rise .8s cubic-bezier(.22,1,.36,1) both}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.22,1,.36,1) both}
    .blink{animation:blink 2.6s ease-in-out infinite}
    .sweep{animation:sweep 6s cubic-bezier(.5,0,.2,1) infinite}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 56s linear infinite}
    .spin-r{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite reverse}
    .star{animation:twinkle 5s ease-in-out infinite}
    .cell{animation:pop .5s cubic-bezier(.22,1,.36,1) both}
    .fade{animation:fade 1.4s ease-out both}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
    @keyframes sweep{0%{transform:translateX(0);opacity:0}16%{opacity:.9}70%{opacity:.35}100%{transform:translateX(128px);opacity:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes twinkle{0%,100%{opacity:.14}50%{opacity:.8}}
    @keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
  </style>
  <rect x="0.5" y="0.5" width="839" height="149" rx="16" fill="#0A0A0A" stroke="#262626"/>
  <text x="32" y="34" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="3" fill="#F5F5F5">CONTACT</text>
  <text x="808" y="34" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" letter-spacing="1.6" fill="#9CB4FF">OPEN TO WORK</text>
  <path d="M32 48H808" stroke="#262626"/>
  <text x="32" y="92" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#F5F5F5">axs.official@gmail.com</text>
  <text x="32" y="118" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#A3A3A3">Anything about a project, a bug, or a boring manual step.</text>
  <text x="808" y="92" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#A3A3A3">github.com/axs-official</text>
  <text x="808" y="114" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#7A7A7A">axs-official.github.io</text>
</svg>