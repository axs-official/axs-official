<svg width="840" height="244" viewBox="0 0 840 244" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Contact axs at axs.contact.me@gmail.com for paid work and business enquiries only. Questions and everything else: the links page at axs-official.github.io/links carries my socials, so message me there.">
  <title>Contact</title>
  <style>
    .rise{animation:rise .8s cubic-bezier(.22,1,.36,1) both}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.22,1,.36,1) both}
    .blink{animation:blink 2.6s ease-in-out infinite}
    .sweep{animation:sweep 6s cubic-bezier(.5,0,.2,1) infinite}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 56s linear infinite}
    .spin-r{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite reverse}
    .star{animation:twinkle 5s ease-in-out infinite}
    .cell{animation:pop .5s cubic-bezier(.22,1,.36,1) both}
    .fade{animation:fade 1.4s ease-out both}
    .float{animation:float 7s ease-in-out infinite}
    .dash{animation:dash 24s linear infinite}
    .draw{animation:draw 3.2s cubic-bezier(.4,0,.2,1) .3s both}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
    @keyframes sweep{0%{transform:translateX(0);opacity:0}16%{opacity:.9}70%{opacity:.35}100%{transform:translateX(128px);opacity:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes twinkle{0%,100%{opacity:.14}50%{opacity:.8}}
    @keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes float{0%,100%{transform:translateY(-3.5px)}50%{transform:translateY(3.5px)}}
    @keyframes dash{to{stroke-dashoffset:-240}}
    @keyframes draw{to{stroke-dashoffset:0}}
  </style><style> .lift{animation:lift .9s cubic-bezier(.22,1,.36,1) both} .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s cubic-bezier(.2,.6,.3,1) infinite} .trail{animation:trail 7s cubic-bezier(.4,0,.2,1) 1.1s infinite} .vtrail{animation:vtrail 8.4s cubic-bezier(.4,0,.2,1) .7s infinite} .glow{animation:glow 4.4s ease-in-out .8s infinite} @keyframes lift{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}} @keyframes pulse{0%{transform:scale(.55);opacity:.6}70%,100%{transform:scale(2.2);opacity:0}} @keyframes trail{0%{transform:translateX(0);opacity:0}9%{opacity:.85}58%{transform:translateX(724px);opacity:.1}59%,100%{transform:translateX(724px);opacity:0}} @keyframes vtrail{0%{transform:translateY(0);opacity:0}12%{opacity:.8}72%{transform:translateY(68px);opacity:.15}73%,100%{transform:translateY(68px);opacity:0}} @keyframes glow{0%,100%{opacity:.3}50%{opacity:.75}}</style>
